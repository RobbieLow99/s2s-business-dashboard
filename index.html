<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column app shell. Summary first (health), then the one thing to fix, then the funnel, then detail. */
:root {
  --bg: #060D19; --bg-2: #0B1A2E; --panel: #0E1F36; --line: #1C3150;
  --fg: #FFFFFF; --fg-2: #A9B6C8; --fg-3: #6B7C93;
  --accent: #8C52FF; --accent-2: #A47BFF; --accent-deep: #7038E6;
  --good: #2BC48A; --ok: #F2B33D; --bad: #F0566A;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); background-image: radial-gradient(1200px 380px at 50% -120px, rgba(140,82,255,.22), transparent 70%); background-repeat: no-repeat; color: var(--fg); font: 400 15px/1.5 var(--font); min-height: 100vh; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--fg-2); } .small { font-size: 13px; } .tiny { font-size: 12px; color: var(--fg-3); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-2); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(6,13,25,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 30px; height: 30px; flex: none; }
.brand-text { min-width: 0; }
.brand-text b { display: block; font-size: 14px; font-weight: 800; letter-spacing: .02em; }
.brand-text span { display: block; font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 1px solid transparent; background: none; color: var(--fg-2); font: 600 13px var(--font); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); background: rgba(140,82,255,.16); border-color: rgba(140,82,255,.45); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
main { padding-block: 24px 64px; display: grid; gap: 28px; }
.section { display: grid; gap: 14px; min-width: 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-head > div { display: grid; gap: 4px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.btn { appearance: none; border: 0; cursor: pointer; font: 700 14px var(--font); color: #fff; padding: 11px 20px; border-radius: 999px; background: linear-gradient(135deg, var(--accent-2), var(--accent-deep)); box-shadow: 0 6px 20px rgba(140,82,255,.3); white-space: nowrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-ghost { appearance: none; cursor: pointer; font: 600 13px var(--font); color: var(--fg-2); background: none; border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
.btn-ghost:hover { color: var(--fg); border-color: var(--fg-3); }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg-2); min-width: 0; }
label small { font-weight: 400; color: var(--fg-3); font-size: 12px; }
input, select, textarea { width: 100%; font: 500 16px var(--font); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input[type="number"] { font-variant-numeric: tabular-nums; }
.select-sm { width: auto; font-size: 14px; padding: 8px 10px; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.form-group { display: grid; gap: 12px; }
.form-group + .form-group { border-top: 1px solid var(--line); padding-top: 16px; }
.form-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--good); color: #05210f; font-weight: 700; padding: 10px 18px; border-radius: 999px; z-index: 20; }
.toast.err { background: var(--bad); color: #fff; }

.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 4px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.kpi[data-rag="good"]::before { background: var(--good); } .kpi[data-rag="ok"]::before { background: var(--ok); } .kpi[data-rag="bad"]::before { background: var(--bad); }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-foot { font-size: 12px; color: var(--fg-3); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
.up { color: var(--good); } .down { color: var(--bad); }

.monday { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: linear-gradient(135deg, rgba(164,123,255,.18), rgba(112,56,230,.10)); border: 1px solid rgba(140,82,255,.5); border-radius: 14px; padding: 14px 18px; }
.monday form { display: flex; gap: 10px; align-items: center; }
.monday input { width: 130px; }

.fixes { display: grid; gap: 10px; }
.fix { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.fix .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.fix.bad .dot { background: var(--bad); box-shadow: 0 0 0 4px rgba(240,86,106,.15); }
.fix.ok .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(242,179,61,.15); }
.fix.good .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(43,196,138,.15); }
.fix h3 { margin-bottom: 2px; }

.funnel { display: grid; gap: 8px; }
.f-row { display: grid; grid-template-columns: minmax(130px, 190px) 1fr 70px 118px; gap: 12px; align-items: center; }
.f-label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.f-track { height: 24px; background: rgba(28,49,80,.55); border-radius: 6px; overflow: hidden; }
.f-bar { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--accent-deep), var(--accent-2)); min-width: 2px; }
.f-val { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; font-size: 15px; }
.f-rate { justify-self: end; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.good { color: var(--good); background: rgba(43,196,138,.12); } .pill.ok { color: var(--ok); background: rgba(242,179,61,.12); }
.pill.bad { color: var(--bad); background: rgba(240,86,106,.12); } .pill.none { color: var(--fg-3); background: rgba(94,110,132,.14); }
.returns { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.returns .kpi-value { font-size: 24px; }
.big-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.spark { width: 46%; max-width: 120px; height: 34px; flex: none; }
.spark-cell .spark { width: 90px; height: 24px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stats.tight { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-radius: 10px; }
.stat { background: var(--panel); padding: 12px 14px; display: grid; gap: 1px; align-content: start; position: relative; }
.stat::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: transparent; }
.stat[data-rag="good"]::after { background: var(--good); } .stat[data-rag="ok"]::after { background: var(--ok); } .stat[data-rag="bad"]::after { background: var(--bad); }
.stat-v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat[data-rag="good"] .stat-v { color: var(--good); } .stat[data-rag="ok"] .stat-v { color: var(--ok); } .stat[data-rag="bad"] .stat-v { color: var(--bad); }
.stat-l { font-size: 12px; font-weight: 600; color: var(--fg-2); }
.stat-s { font-size: 11px; color: var(--fg-3); }
.stat-s a { color: var(--accent-2); }
.goal { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.goal-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; }
.goal-track { height: 12px; background: rgba(28,49,80,.7); border-radius: 999px; overflow: hidden; }
.goal-bar { height: 100%; background: linear-gradient(90deg, var(--accent-deep), var(--accent-2)); border-radius: 999px; }
.spend-in { width: 92px; padding: 5px 8px; font-size: 13px; text-align: right; }

.verdict { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 22px 22px 20px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); }
.verdict h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 6px 0 6px; }
.verdict p { color: var(--fg-2); font-size: 15px; }
.verdict.up { background: linear-gradient(135deg, rgba(43,196,138,.18), rgba(43,196,138,.03)); border-color: rgba(43,196,138,.45); }
.verdict.up h1 { color: #7BE3B9; }
.verdict.down { background: linear-gradient(135deg, rgba(240,86,106,.18), rgba(240,86,106,.03)); border-color: rgba(240,86,106,.45); }
.verdict.down h1 { color: #FF9AA8; }
.verdict.flat { background: linear-gradient(135deg, rgba(140,82,255,.18), rgba(140,82,255,.03)); border-color: rgba(140,82,255,.45); }
.admin-h { font-size: clamp(22px, 3.4vw, 30px); font-weight: 800; }
.kpi.big .kpi-value { font-size: 34px; }
.hero-fix { border-radius: 16px; padding: 18px 20px; border: 1px solid var(--line); display: grid; gap: 6px; }
.hero-fix h2 { font-size: 20px; }
.hero-fix p { color: var(--fg-2); font-size: 14px; max-width: 70ch; }
.hero-fix.bad { background: linear-gradient(135deg, rgba(240,86,106,.16), rgba(240,86,106,.04)); border-color: rgba(240,86,106,.5); }
.hero-fix.ok { background: linear-gradient(135deg, rgba(242,179,61,.16), rgba(242,179,61,.04)); border-color: rgba(242,179,61,.5); }
.hero-fix.good { background: linear-gradient(135deg, rgba(43,196,138,.16), rgba(43,196,138,.04)); border-color: rgba(43,196,138,.5); }
.fixes.compact .fix { padding: 10px 14px; }
.fixes.compact .fix h3 { font-size: 14px; font-weight: 600; margin: 0; }
.ads-line { display: grid; gap: 6px; }
.big-sentence { font-size: clamp(18px, 2.6vw, 24px); font-weight: 600; line-height: 1.35; color: var(--fg-2); }
.big-sentence b { color: var(--fg); font-weight: 800; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtab { appearance: none; cursor: pointer; font: 700 13px var(--font); color: var(--fg-2); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; }
.subtab[aria-selected="true"] { color: var(--fg); border-color: var(--accent); background: rgba(140,82,255,.16); }
.funnel .f-row { grid-template-columns: minmax(150px, 210px) 1fr 70px 118px !important; }
.f-row.leak .f-label { color: #FF9AA8; }
.f-row.leak .f-bar { background: linear-gradient(90deg, #B8364A, var(--bad)); }
.f-delta { font-size: 11px; margin-left: 4px; }
.leak-note { margin: 16px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(240,86,106,.10); border: 1px solid rgba(240,86,106,.35); font-size: 13px; color: var(--fg-2); }
.leak-note b { color: #FF9AA8; }
.risk-list { display: grid; gap: 10px; }
.risk { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.risk.high { border-color: rgba(240,86,106,.5); }
.risk.medium { border-color: rgba(242,179,61,.45); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 600; color: var(--fg-2); background: var(--bg-2); border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px; }
.wins { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.win { display: grid; gap: 6px; align-content: start; border-color: rgba(43,196,138,.4); background: linear-gradient(160deg, rgba(43,196,138,.10), transparent 60%), var(--panel); }
.win h3 { font-size: 18px; color: #7BE3B9; }
.win .btn-ghost { justify-self: start; }

.rev-line { margin-top: 4px; font-weight: 700; font-size: 14px !important; }
.rev-line.up { color: #7BE3B9 !important; } .rev-line.down { color: #FF9AA8 !important; }
.cmp { display: grid; gap: 22px; padding-top: 10px; }
.cmp-row { display: grid; grid-template-columns: minmax(130px, 180px) 1fr 70px; gap: 14px; align-items: center; }
.cmp-label { font-size: 13px; font-weight: 700; } .cmp-label small { display: block; font-weight: 500; font-size: 11px; color: var(--fg-3); }
.cmp-track { position: relative; height: 16px; background: rgba(28,49,80,.7); border-radius: 999px; }
.cmp-bar { height: 100%; border-radius: 999px; background: var(--accent-2); }
.cmp-bar.good { background: var(--good); } .cmp-bar.bad { background: var(--bad); }
.cmp-mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #fff; }
.cmp-mark.top { background: var(--ok); }
.cmp-mark i { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-style: normal; font-size: 10px; font-weight: 700; white-space: nowrap; color: var(--fg-2); }
.cmp-mark.top i { top: auto; bottom: -17px; color: var(--ok); }
.cmp-you { font-size: 20px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; } .cmp-you small { display: block; font-size: 10px; font-weight: 600; color: var(--fg-3); }
.cmp-you.good { color: var(--good); } .cmp-you.bad { color: var(--bad); }
.meta-card { display: grid; gap: 8px; border-style: dashed; }
.ticks { margin: 0; padding-left: 18px; color: var(--fg-2); font-size: 14px; display: grid; gap: 4px; }
main > .divided { border-top: 1px solid var(--line); padding-top: 26px; }
.channel-tabs { margin-top: 0; margin-bottom: 18px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.channel-tabs .subtab { text-align: center; padding: 10px 6px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { .channel-tabs { grid-template-columns: repeat(3, 1fr); } .channel-tabs .subtab[data-ch="all"] { grid-column: 1 / -1; } }
.preview { opacity: .85; }
.soon { font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 6px; margin-left: 4px; }

.churn-line { font-size: 13px !important; color: var(--fg-2) !important; margin-top: 2px; }
.churn-line.down { color: #FF9AA8 !important; }
.since-sub { font-size: 12px; font-weight: 700; color: var(--fg-2); } .since-sub.down { color: #FF9AA8; } .since-sub.up { color: #7BE3B9; }
.next-up > summary { font-size: 13px; color: var(--fg-2); margin-top: 6px; }
.next-up[open] > summary { margin-bottom: 10px; }
.speed-strip { display: grid; grid-template-columns: minmax(150px, 1.1fr) repeat(4, 1fr); gap: 1px; padding: 0; overflow: hidden; background: var(--line); margin-bottom: 14px; }
.speed-strip > div:first-child { background: var(--panel); padding: 12px 14px; display: grid; align-content: center; gap: 2px; }
@media (max-width: 760px) { .speed-strip { grid-template-columns: 1fr 1fr; } .speed-strip > div:first-child { grid-column: 1 / -1; } }

.building { display: grid; gap: 10px; border-color: rgba(140,82,255,.45); }
.build-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.build-steps > div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.build-steps > div b { color: var(--fg); }
.build-steps > div.done { border-color: rgba(43,196,138,.45); }
.build-steps > div.done b::before { content: "✓ "; color: var(--good); }
.boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.board ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.board li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.board .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--bg-2); color: var(--fg-2); }
.rank.r1 { background: #F2B33D; color: #2a1d00; } .rank.r2 { background: #C9D3E0; color: #111; } .rank.r3 { background: #C98B5A; color: #1d0f04; }
.outside-pay { display: grid; gap: 6px; border-color: rgba(242,179,61,.5); background: linear-gradient(135deg, rgba(242,179,61,.10), transparent 70%), var(--panel); }

.brand-text .brand-kicker { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-2); }
.brand-text b { font-size: 15px !important; letter-spacing: 0 !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.coach-logo { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: #fff; flex: none; }

@media (max-width: 600px) {
  .funnel .f-row { grid-template-columns: 1fr auto auto !important; gap: 4px 10px; }
  .funnel .f-row .f-track { grid-column: 1 / -1; grid-row: 2; height: 14px; }
  .funnel .f-row .f-val { grid-column: 2; grid-row: 1; }
  .funnel .f-row .f-rate { grid-column: 3; grid-row: 1; }
  .funnel { gap: 12px; }
  .card { padding: 14px; }
  .kpi.big .kpi-value { font-size: 26px; }
  .big-row { flex-direction: column; align-items: stretch; gap: 6px; }
  .big-row .spark { width: 100%; max-width: none; height: 26px; }
  .kpi-foot { flex-direction: column; gap: 2px; }
  .brand-text .brand-kicker { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .verdict { padding: 16px; }
  .verdict h1 { font-size: 24px; }
  .hero-fix h2 { font-size: 18px; }
  .big-sentence { font-size: 17px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat-v { font-size: 19px; }
  .cmp-row { grid-template-columns: 1fr 64px; }
  .cmp-row .cmp-track { grid-column: 1 / -1; grid-row: 2; }
  .msg-head .row { width: 100%; }
  .msg-head .pill { white-space: normal; text-align: left; }
  .risk { flex-direction: column; }
  .subtabs .subtab { flex: 1 1 auto; }
  .monday h3 { font-size: 14px; }
  .section-head { align-items: flex-start; }
  .channel-tabs .soon { display: none; }
  .grid-form { grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-form label small { display: none; }
}
.detail-box, #detail { min-width: 0; }
.speed-strip > .stat { min-width: 0; }
.back-btn { appearance: none; cursor: pointer; font: 700 13px var(--font); color: var(--accent-2); background: rgba(140,82,255,.12); border: 1px solid rgba(140,82,255,.45); padding: 7px 12px; border-radius: 999px; white-space: nowrap; flex: none; }
.top-row { flex-wrap: nowrap; }
.top-row > .brand { flex: 1; }
.key-stat { display: flex; gap: 16px; align-items: center; }
.key-stat .kpi-value { font-size: 34px; color: var(--accent-2); }
.brand-text b.biz-name { font-size: 19px !important; font-weight: 800; letter-spacing: -.01em !important; line-height: 1.2; }
.example-flag { padding: 10px 14px; border-radius: 10px; border: 1px dashed rgba(242,179,61,.6); background: rgba(242,179,61,.08); color: var(--fg-2); font-size: 13px; }
.example-flag b { color: var(--ok); }

  const sec = el("section", "section", `<div class="section-head"><div><h2>Coaches, links and CRM</h2><p class="tiny">Each link is that coach's private login. Never share one coach's link with another, and never put your own link in a coach's CRM.</p></div></div>`);
  for (const c of (S.admin || [])) {
    const card = el("div", "card coach-admin", `<div class="row" style="justify-content:space-between"><h3>${esc(c.business || c.name)} ${c.active ? "" : '<span class="pill none">paused</span>'}</h3>${crmStatus(c)}</div>
      <div class="row"><input readonly value="${esc(linkFor(c.code))}" aria-label="Private link for ${esc(c.business || c.name)}">
        <button class="btn-ghost copy">Copy link</button><button class="btn-ghost newlink">New link</button><button class="btn-ghost pause">${c.active ? "Pause" : "Unpause"}</button></div>
      <details class="more"><summary>CRM and Circle connection</summary>
        <div class="grid-form">
          <label>CRM version<select class="crm"><option value="new" ${c.crm === "new" ? "selected" : ""}>New CRM</option><option value="legacy" ${c.crm === "legacy" ? "selected" : ""}>Legacy CRM</option><option value="none" ${c.crm === "none" ? "selected" : ""}>Not connected</option></select></label>
          <label>Location ID<input class="loc" value="${esc(c.ghl_location || "")}" placeholder="from the sub-account URL"></label>
          <label>Read-only key <small>${c.crm_connected ? "Saved. Leave blank to keep it" : "Settings › Private Integrations"}</small><input class="tok" type="password" autocomplete="off" placeholder="pit-…"></label>
          <label>Coach's email <small>The one they use for Circle</small><input class="em" type="email" value="${esc(c.email || "")}" placeholder="coach@…"></label>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn-ghost linksent">${c.link_sent_at ? "Link sent ✓" : "Mark link sent"}</button><button class="btn-ghost savecrm">Save connection</button><button class="btn-ghost sync">Sync now</button>${c.sync_error ? `<span class="status" style="color:var(--bad)">${esc(c.sync_error)}</span>` : ""}</div>
      </details>`);
    card.querySelector(".copy").addEventListener("click", ev => copy(linkFor(c.code), ev.target));
    const nl = card.querySelector(".newlink");
    nl.addEventListener("click", async () => {
      if (nl.dataset.sure !== "1") { nl.dataset.sure = "1"; nl.textContent = "Tap again: the old link stops working"; return; }
      await rpc("kpi_admin_new_link", { p_code: S.code, p_coach: c.id }); await loadAdmin(); render(); toast("New link made. Send it to the coach.");
    });
    const pz = card.querySelector(".pause");
    pz.addEventListener("click", async () => {
      if (c.active && pz.dataset.sure !== "1") { pz.dataset.sure = "1"; pz.textContent = "Tap again to pause"; return; }
      await rpc("kpi_admin_set_active", { p_code: S.code, p_coach: c.id, p_active: !c.active }); await loadAdmin(); render();
    });
    card.querySelector(".linksent").addEventListener("click", async () => { try { await rpc("kpi_admin_set_link_sent", { p_code: S.code, p_coach: c.id, p_sent: !c.link_sent_at }); await loadAdmin(); render(); } catch (e) { toast("Didn't save. Try again.", true); } });
    card.querySelector(".savecrm").addEventListener("click", async () => {
      try { await rpc("kpi_admin_set_email", { p_code: S.code, p_coach: c.id, p_email: card.querySelector(".em").value });
        await rpc("kpi_admin_set_crm", { p_code: S.code, p_coach: c.id, p_crm: card.querySelector(".crm").value, p_location: card.querySelector(".loc").value, p_token: card.querySelector(".tok").value });
        await rpc("kpi_admin_sync_now", { p_code: S.code, p_coach: c.id }); await loadAdmin(); render(); toast("Saved. First sync is running: refresh in a minute."); }
      catch (er) { toast("Couldn't save the connection.", true); }
    });
    card.querySelector(".sync").addEventListener("click", async ev => { await rpc("kpi_admin_sync_now", { p_code: S.code, p_coach: c.id }); ev.target.textContent = "Syncing… refresh in a minute"; });
    sec.appendChild(card);
  }
  main.appendChild(sec);
}

window.__s2sLogo = logo();
boot();
</script>
</body>
</html>
